<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recipe</title>
</head>
<body>

<a href="/admin"><-Back to admin panel</a>

<h1 th:if="${recipe.id == null}">
    Add Recipe
</h1>

<h1 th:if="${recipe.id != null}">
    Edit Recipe
</h1>

<form th:if="${recipe.id == null}"
      th:action="@{/admin/recipes}"
      th:object="${recipe}"
      method="post">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <label>
        Name:
        <input type="text"
               th:field="*{name}"
               required>
    </label>

    <br><br>

    <label>
        Description:
        <textarea th:field="*{description}"></textarea>
    </label>

    <br><br>

    <label>
        Price:
        <input type="number"
               step="0.01"
               th:field="*{price}"
               required>
    </label>

    <br><br>

    <label>
        Ingredients:
        <textarea th:field="*{ingredients}"></textarea>
    </label>

    <br><br>

    <label>
        Image URL:
        <input type="text"
               th:field="*{imageUrl}">
    </label>

    <br><br>

    <button type="submit">
        Create Recipe
    </button>

</form>

<form th:if="${recipe.id != null}"
      th:action="@{/admin/recipes/update/{id}(id=${recipe.id})}"
      th:object="${recipe}"
      method="post">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <label>
        Name:
        <input type="text"
               th:field="*{name}"
               required>
    </label>

    <br><br>

    <label>
        Description:
        <textarea th:field="*{description}"></textarea>
    </label>

    <br><br>

    <label>
        Price:
        <input type="number"
               step="0.01"
               th:field="*{price}"
               required>
    </label>

    <br><br>

    <label>
        Ingredients:
        <textarea th:field="*{ingredients}"></textarea>
    </label>

    <br><br>

    <label>
        Image URL:
        <input type="text"
               th:field="*{imageUrl}">
    </label>

    <br><br>

    <button type="submit">
        Save Changes
    </button>

</form>

</body>
</html>
