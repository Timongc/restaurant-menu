<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Favorites</title>
</head>
<body>

<a href="/"><-Back to menu</a>

<h1>My Favorites</h1>

<div th:if="${favorites.isEmpty()}">
    <p>You don't have any favorites yet._.</p>
</div>

<div th:each="favorite : ${favorites}">

    <h2>
        <a th:href="@{/recipes/{id}(id=${favorite.recipe.id})}"
           th:text="${favorite.recipe.name}">
            Recipe name
        </a>
    </h2>

    <p th:text="${favorite.recipe.description}">
        Description
    </p>

    <p>
        Price:
        <span th:text="${favorite.recipe.price}">0</span>
    </p>

    <form th:action="@{/favorites/remove/{id}(id=${favorite.recipe.id})}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button type="submit">
            Remove from favorites
        </button>

    </form>

    <hr>

</div>

</body>
</html>
