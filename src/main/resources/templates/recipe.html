<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${recipe.name}">Recipe</title>
</head>
<body>

<a href="/">Back to menu</a>

<h1 th:text="${recipe.name}">Recipe name</h1>

<p th:text="${recipe.description}">
  Description
</p>

<p>
  <strong>Price</strong>
  <span th:text="${recipe.price}">0</span>
</p>

<img th:if="${recipe.imageUrl != null}"
      th:src="${recipe.imageUrl}"
      alt="Recipe image"
      width="300">

<div sec:authorize="isAuthenticated()">

    <div th:if="${!isFavorite}">

        <form th:action="@{/favorites/add/{id}(id=${recipe.id})}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit">
                Add to favorites
            </button>

        </form>

    </div>

    <div th:if="${isFavorite}">

        <form th:action="@{/favorites/remove/{id}(id=${recipe.id})}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit">
                Remove from favorites
            </button>

        </form>

    </div>

</div>

</body>
</html>
