<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Restaurant Menu</title>
</head>
<body>

<div>

    <span sec:authorize="isAuthenticated()">
        Hello, <span sec:authentication="name"></span>!

        <hr>

        <a href="/favorites">look on your favorites</a>

        <br>

        <form th:action="@{/logout}" method="post" style="dispay: inline;">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
            <button type="submit">Logout</button>
        </form>

    </span>

    <scan sec:authorize="!isAuthenticated()">
        <a href="/login">Login</a>
        |
        <a href="/register">Register</a>
    </scan>
</div>

<hr>

<h1>Restaurant Menu</h1>

<div th:each="recipe : ${recipes}">

    <h2>
        <a th:href="@{/recipes/{id}(id=${recipe.id})}"
            th:text="${recipe.name}">
            Recipe name
        </a>
    </h2>

    <p th:text="${recipe.description}">
        Recipe description
    </p>

    <p>
        Price:
        <span th:text="${recipe.price}">0</span>
    </p>

    <p>
        Ingredients:
        <span th:text="${recipe.ingredients}">Ingredients</span>
    </p>

    <hr>

</div>

</body>
</html>
